name: Release Download Monitor

on:
  schedule:
    # Her 3 saatte bir çalışır
    - cron: "0 * * * *"

  # Manuel çalıştırmak için
  workflow_dispatch:

permissions:
  contents: write

env:
  OWNER: isa-ozturk
  REPO: LenzeSDCardTool-releases
  STATE_FILE: .github/download-state.json

jobs:
  monitor-downloads:
    name: Monitor GitHub Release Downloads
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release data from GitHub API
        run: |
          set -e

          curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${OWNER}/${REPO}/releases/latest" \
            > latest-release.json

          jq '{
            checked_at_utc: now | strftime("%Y-%m-%d %H:%M:%S UTC"),
            release: {
              id: .id,
              tag_name: .tag_name,
              name: .name,
              html_url: .html_url,
              published_at: .published_at
            },
            assets: [
              .assets[] | {
                id: .id,
                name: .name,
                download_count: .download_count,
                browser_download_url: .browser_download_url
              }
            ]
          }' latest-release.json > current-download-state.json

      - name: Compare download counts
        id: compare
        run: |
          set -e

          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          state_file = Path(os.environ["STATE_FILE"])
          current_file = Path("current-download-state.json")

          current = json.loads(current_file.read_text(encoding="utf-8"))

          if state_file.exists():
              previous = json.loads(state_file.read_text(encoding="utf-8"))
              first_run = False
          else:
              previous = {
                  "release": {},
                  "assets": []
              }
              first_run = True

          previous_assets = {
              str(asset.get("id")): asset
              for asset in previous.get("assets", [])
          }

          changes = []

          for asset in current.get("assets", []):
              asset_id = str(asset.get("id"))
              current_count = int(asset.get("download_count", 0))

              previous_asset = previous_assets.get(asset_id)
              previous_count = int(previous_asset.get("download_count", 0)) if previous_asset else 0

              diff = current_count - previous_count

              if diff > 0 and not first_run:
                  changes.append({
                      "name": asset.get("name"),
                      "previous_count": previous_count,
                      "current_count": current_count,
                      "increase": diff,
                      "download_url": asset.get("browser_download_url")
                  })

          total_previous = sum(int(a.get("download_count", 0)) for a in previous.get("assets", []))
          total_current = sum(int(a.get("download_count", 0)) for a in current.get("assets", []))
          total_increase = total_current - total_previous

          result = {
              "first_run": first_run,
              "has_changes": len(changes) > 0,
              "checked_at_utc": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC"),
              "release_tag": current.get("release", {}).get("tag_name"),
              "release_url": current.get("release", {}).get("html_url"),
              "total_previous": total_previous,
              "total_current": total_current,
              "total_increase": total_increase,
              "changes": changes
          }

          Path("download-changes.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          if first_run:
              message = (
                  "GitHub Release download takibi başlatıldı.\n\n"
                  f"Repo: {os.environ['OWNER']}/{os.environ['REPO']}\n"
                  f"Latest Release: {result['release_tag']}\n"
                  f"Mevcut toplam indirme: {total_current}\n\n"
                  "Bu ilk çalışma olduğu için bildirim gönderilmedi. "
                  "Sonraki çalışmalarda indirme sayısı artarsa bildirim gönderilecek."
              )
          elif changes:
              lines = []
              lines.append("GitHub Release dosyası indirildi.")
              lines.append("")
              lines.append(f"Repo: {os.environ['OWNER']}/{os.environ['REPO']}")
              lines.append(f"Release: {result['release_tag']}")
              lines.append(f"Toplam önceki indirme: {total_previous}")
              lines.append(f"Toplam yeni indirme: {total_current}")
              lines.append(f"Toplam artış: +{total_increase}")
              lines.append("")
              lines.append("Dosya detayları:")

              for item in changes:
                  lines.append("")
                  lines.append(f"- Dosya: {item['name']}")
                  lines.append(f"  Önceki: {item['previous_count']}")
                  lines.append(f"  Yeni: {item['current_count']}")
                  lines.append(f"  Artış: +{item['increase']}")

              lines.append("")
              lines.append(f"Release URL: {result['release_url']}")
              lines.append(f"Kontrol zamanı: {result['checked_at_utc']}")

              message = "\n".join(lines)
          else:
              message = "No changes."

          Path("notification-message.txt").write_text(message, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"first_run={str(first_run).lower()}\n")
              output.write(f"has_changes={str(len(changes) > 0).lower()}\n")
          PY

      - name: Send Telegram notification
        if: steps.compare.outputs.has_changes == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping Telegram notification."
            exit 0
          fi

          MESSAGE="$(cat notification-message.txt)"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Send email notification
        if: steps.compare.outputs.has_changes == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -e

          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_PORT" ] || [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$MAIL_FROM" ] || [ -z "$MAIL_TO" ]; then
            echo "Email secrets are not fully configured. Skipping email notification."
            exit 0
          fi

          python3 <<'PY'
          import os
          import smtplib
          from email.mime.text import MIMEText
          from email.header import Header

          smtp_host = os.environ["SMTP_HOST"]
          smtp_port = int(os.environ["SMTP_PORT"])
          smtp_username = os.environ["SMTP_USERNAME"]
          smtp_password = os.environ["SMTP_PASSWORD"]
          mail_from = os.environ["MAIL_FROM"]
          mail_to = os.environ["MAIL_TO"]

          body = open("notification-message.txt", "r", encoding="utf-8").read()

          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = Header("GitHub Release Download Bildirimi", "utf-8")
          msg["From"] = mail_from
          msg["To"] = mail_to

          with smtplib.SMTP(smtp_host, smtp_port, timeout=30) as server:
              server.ehlo()
              server.starttls()
              server.ehlo()
              server.login(smtp_username, smtp_password)
              server.sendmail(mail_from, [mail_to], msg.as_string())
          PY

      - name: Update download state file
        if: always()
        run: |
          set -e

          mkdir -p .github
          cp current-download-state.json "${STATE_FILE}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${STATE_FILE}"

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update release download state"
          git push
